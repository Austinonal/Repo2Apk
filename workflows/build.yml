name: build-apk
on:
  workflow_dispatch:
    inputs:
      repo: { description: 'owner/name', required: true }
      branch: { description: 'branch (optional)', required: false, default: '' }
      job: { description: 'job id from the website', required: true }

permissions:
  contents: write

env:
  REPO: ${{ inputs.repo }}
  BRANCH: ${{ inputs.branch }}
  JOB: ${{ inputs.job }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false } # target repo's npm scripts must not be able to read our token
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Clone target repo (public only)
        run: |
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo bad repo; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9_./-]*$ ]] || { echo bad branch; exit 1; }
          git clone --depth 1 ${BRANCH:+-b "$BRANCH"} "https://github.com/$REPO" src

      - name: Clean up repo into www/ + report
        run: REPO_NAME="${REPO#*/}" node scripts/prepare.mjs

      - name: Build debug APK with Capacitor
        run: |
          mkdir app && mv www app/www && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Add APK facts to report and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          {
            echo "### APK ที่ได้"
            echo "- ขนาด: $(du -h "$APK" | cut -f1)"
            echo "- ไฟล์เว็บที่ถูกใส่ใน APK: $(find app/www -type f | wc -l) ไฟล์"
            echo "- สิทธิ์ที่ APK ขอ:"
            "$AAPT" dump permissions "$APK" | grep uses-permission | sed 's/^/  - /' || true
          } >> report.md
          cp "$APK" "${REPO#*/}.apk"
          gh release create "apk-$JOB" "${REPO#*/}.apk" --title "$APP_NAME" --notes-file report.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-$JOB" --title "FAILED" \
            --notes "Build ล้มเหลว ดู log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
