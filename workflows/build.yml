name: build-app
on:
  workflow_dispatch:
    inputs:
      repo: { description: 'owner/name', required: true }
      branch: { required: false, default: '' }
      job: { description: 'job id from the website', required: true }
      targets: { description: 'android,windows,mac,ios', required: false, default: 'android' }
      skip: { description: 'rule ids to keep (not cut)', required: false, default: '' }
      name: { description: 'app name', required: false, default: '' }

permissions:
  contents: write

env:
  REPO: ${{ inputs.repo }}
  BRANCH: ${{ inputs.branch }}
  JOB: ${{ inputs.job }}
  TARGETS: ${{ inputs.targets }}
  SKIP: ${{ inputs.skip }}
  APP_NAME: ${{ inputs.name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.p.outputs.name }}
      id: ${{ steps.p.outputs.id }}
      android: ${{ steps.p.outputs.android }}
      native: ${{ steps.p.outputs.native }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false } # target repo's npm scripts must not be able to read our token
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Clone target repo (public only)
        run: |
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo bad repo; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9_./-]*$ ]] || { echo bad branch; exit 1; }
          [[ "$TARGETS" =~ ^[a-z,]+$ && "$SKIP" =~ ^[a-z,]*$ ]] || { echo bad input; exit 1; }
          git clone --depth 1 ${BRANCH:+-b "$BRANCH"} "https://github.com/$REPO" src
      - id: p
        name: Clean up repo into www/ + report
        run: REPO_NAME="${REPO#*/}" node scripts/prepare.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            www
            report.md
          include-hidden-files: true

  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.prepare.outputs.name }}
      ID: ${{ needs.prepare.outputs.id }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build debug APK with Capacitor
        run: |
          mkdir app && mv site/www app/www && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$NAME" "$ID" --web-dir www
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Collect
        run: |
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          mkdir out && cp "$APK" "out/${REPO#*/}-android.apk"
          {
            echo "### Android (APK) ที่ได้"
            echo "- ขนาด: $(du -h "$APK" | cut -f1)"
            echo "- ไฟล์เว็บที่ใส่ใน APK: $(find app/www -type f | wc -l) ไฟล์"
            echo "- สิทธิ์ที่ APK ขอ:"
            "$AAPT" dump permissions "$APK" | grep uses-permission | sed 's/^/  - /' || true
            echo
          } > out/facts-android.md
      - uses: actions/upload-artifact@v4
        with: { name: out-android, path: out }

  native:
    needs: prepare
    if: needs.prepare.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run: { shell: bash }
    env:
      NAME: ${{ needs.prepare.outputs.name }}
      ID: ${{ needs.prepare.outputs.id }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Windows / macOS (Electron)
        if: matrix.t != 'ios'
        run: |
          mkdir out el && mv site/www el/www && cd el
          cat > main.js <<'JS'
          const { app, BrowserWindow, protocol, net } = require('electron');
          const path = require('path'), { pathToFileURL } = require('url');
          protocol.registerSchemesAsPrivileged([{ scheme: 'app', privileges: { standard: true, secure: true, supportFetchAPI: true, stream: true } }]);
          app.whenReady().then(() => {
            const root = path.join(__dirname, 'www');
            protocol.handle('app', r => {
              const p = path.normalize(decodeURIComponent(new URL(r.url).pathname));
              const f = path.join(root, p === '/' ? 'index.html' : p);
              return f.startsWith(root) ? net.fetch(pathToFileURL(f).toString()) : new Response('', { status: 403 });
            });
            new BrowserWindow({ width: 1100, height: 760, autoHideMenuBar: true }).loadURL('app://local/');
          });
          app.on('window-all-closed', () => app.quit());
          JS
          node -e 'require("fs").writeFileSync("package.json", JSON.stringify({name:"app",version:"1.0.0",description:process.env.NAME,author:"repo2apk",main:"main.js",build:{appId:process.env.ID,productName:process.env.NAME,artifactName:"app.${ext}",files:["main.js","www/**"],win:{target:"nsis"},mac:{target:"dmg"}}}))'
          npm i -D electron@33 electron-builder@25
          if [ "${{ matrix.t }}" = windows ]; then F="--win"; X=exe; else F="--mac"; X=dmg; fi
          npx electron-builder $F --publish never
          cp "dist/app.$X" "../out/${REPO#*/}-${{ matrix.t }}.$X"
          printf '### %s ที่ได้\n- ขนาด: %s\n\n' "${{ matrix.t }}" "$(du -h "dist/app.$X" | cut -f1)" > ../out/facts-${{ matrix.t }}.md
      - name: iOS (Xcode project)
        if: matrix.t == 'ios'
        run: |
          mkdir out app && mv site/www app/www && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          npx cap init "$NAME" "$ID" --web-dir www
          npx cap add ios
          npx cap sync ios
          zip -qr "../out/${REPO#*/}-ios-xcode.zip" ios -x 'ios/App/Pods/*'
          printf '### iOS (โปรเจกต์ Xcode) ที่ได้\n- แตก zip บน Mac รัน `npx cap sync ios` แล้วเปิด ios/App/App.xcworkspace ใน Xcode เพื่อเซ็นชื่อและรัน\n\n' > ../out/facts-ios.md
      - uses: actions/upload-artifact@v4
        with: { name: "out-${{ matrix.t }}", path: out }

  publish:
    needs: [prepare, android, native]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: site }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: 'out-*', path: out, merge-multiple: true }
      - name: Release
        run: |
          shopt -s nullglob
          bins=(out/*.apk out/*.exe out/*.dmg out/*.zip)
          if [ ${#bins[@]} -eq 0 ]; then
            gh release create "apk-$JOB" --title FAILED --notes "Build ล้มเหลว ดู log: $RUN_URL"; exit 0
          fi
          {
            cat site/report.md out/facts-*.md
            [ "${{ needs.android.result }}" = failure ] && echo "- Android สร้างไม่สำเร็จ ดู log: $RUN_URL"
            [ "${{ needs.native.result }}" = failure ] && echo "- Windows/macOS/iOS บางตัวสร้างไม่สำเร็จ ดู log: $RUN_URL"
            true
          } > notes.md
          gh release create "apk-$JOB" "${bins[@]}" --title "${{ needs.prepare.outputs.name }}" --notes-file notes.md
          gh release list --limit 200 --json tagName,createdAt -q 'sort_by(.createdAt)|reverse|.[20:]|.[].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes || true
